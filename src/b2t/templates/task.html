<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("web_title") }} · 任务</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-3xl mx-auto px-6 py-8 space-y-6">
    <a href="/" class="text-sm text-indigo-600">← {{ t("web_back_home") }}</a>

    <section class="rounded-xl border border-gray-200 bg-white p-6 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold">
            {% if task and task.kind == "correction" %}文本修正{% else %}转写任务{% endif %}
          </h1>
          <p class="mt-1 text-xs font-mono text-gray-500">{{ task_id }}</p>
        </div>
        <span id="task-badge" class="rounded-full bg-gray-100 px-3 py-1 text-xs text-gray-600">
          {{ task.status if task else "queued" }}
        </span>
      </div>

      <div class="h-3 overflow-hidden rounded-full bg-gray-200">
        <div id="task-bar" class="h-full w-0 bg-indigo-600 transition-all"></div>
      </div>
      <p id="task-message" class="text-sm text-gray-600">正在获取任务进度…</p>

      <ol id="stage-list" class="grid grid-cols-2 gap-2 text-sm sm:grid-cols-4"></ol>

      <div id="task-error" class="hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

      <div class="flex flex-wrap gap-3 pt-2">
        <button id="cancel-button" type="button" class="hidden rounded border border-red-300 px-4 py-2 text-sm text-red-700 hover:bg-red-50">取消任务</button>
        <a id="retry-link" href="/" class="hidden rounded bg-indigo-600 px-4 py-2 text-sm text-white">重试</a>
      </div>
    </section>
  </main>

  <script>
    const taskId = {{ task_id|tojson }};
    const taskKind = {{ (task.kind if task else "transcription")|tojson }};
    const initialVideoId = {{ (task.video_id if task else none)|tojson }};
    const stages = taskKind === "correction"
      ? [{ key: "queued", label: "排队" }, { key: "correcting", label: "LLM 修正" }, { key: "completed", label: "完成" }]
      : [
          { key: "queued", label: "排队" },
          { key: "downloading", label: "下载" },
          { key: "extracting_audio", label: "提取音频" },
          { key: "transcribing", label: "转写" },
          { key: "writing_outputs", label: "写入" },
          { key: "indexing", label: "入库" },
          { key: "completed", label: "完成" }
        ];

    const stageList = document.getElementById("stage-list");
    stages.forEach((stage) => {
      const item = document.createElement("li");
      item.dataset.stage = stage.key;
      item.className = "rounded border border-gray-200 px-3 py-2 text-gray-500";
      item.textContent = stage.label;
      stageList.appendChild(item);
    });

    function markStage(currentStage, status) {
      const keys = stages.map((stage) => stage.key);
      let index = keys.indexOf(currentStage);
      if (index === -1 && status === "completed") index = keys.length - 1;
      if (index === -1 && status === "failed") index = keys.indexOf("failed");
      document.querySelectorAll("#stage-list li").forEach((item) => {
        const itemIndex = keys.indexOf(item.dataset.stage);
        item.className = "rounded border px-3 py-2";
        if (status === "failed" && itemIndex === 0) {
          item.className += " border-red-300 bg-red-50 text-red-700";
        } else if (itemIndex < index) {
          item.className += " border-green-200 bg-green-50 text-green-700";
        } else if (itemIndex === index) {
          item.className += " border-indigo-300 bg-indigo-50 text-indigo-700 font-medium";
        } else {
          item.className += " border-gray-200 text-gray-500";
        }
      });
    }

    function guidance(message) {
      if (message.includes("412")) return "可能是 B 站风控限制，请稍后重试或更换网络。";
      if (message.toLowerCase().includes("ffmpeg")) return "缺少 ffmpeg，请安装后重新启动服务。";
      if (message.includes("model") || message.includes("模型")) return "模型可能尚未下载，请确认模型名或先完成下载。";
      if (message.includes("超时")) return "请求超时，可在设置页调整超时时间或稍后重试。";
      return "请检查配置或输入后重试。";
    }

    async function poll() {
      const response = await fetch(`/api/tasks/${taskId}/progress`);
      if (!response.ok) return;
      const data = await response.json();
      const percent = Math.max(0, Math.min(100, Math.round((data.progress_percent || 0) * 100)));
      document.getElementById("task-bar").style.width = `${percent}%`;
      document.getElementById("task-badge").textContent = data.status;
      document.getElementById("task-message").textContent = `${data.current_stage || ""} · ${data.current_message || ""}`;
      markStage(data.current_stage, data.status);

      const cancelButton = document.getElementById("cancel-button");
      const retryLink = document.getElementById("retry-link");
      const errorBox = document.getElementById("task-error");
      cancelButton.classList.toggle("hidden", !(taskKind === "correction" && (data.status === "queued" || data.status === "running")));

      if (data.status === "failed") {
        errorBox.classList.remove("hidden");
        errorBox.textContent = `${data.error_message || "任务失败"}。${guidance(data.error_message || "")}`;
        retryLink.classList.remove("hidden");
        retryLink.href = taskKind === "correction" && data.video_id ? `/videos/${data.video_id}` : "/";
        retryLink.textContent = "重试";
        return;
      }

      if (data.status === "cancelled") {
        errorBox.classList.remove("hidden");
        errorBox.textContent = "任务已取消。";
        retryLink.classList.remove("hidden");
        retryLink.href = taskKind === "correction" && data.video_id ? `/videos/${data.video_id}` : "/";
        retryLink.textContent = "返回重试";
        return;
      }

      if (data.status === "completed") {
        const videoId = data.video_id || initialVideoId;
        if (videoId) {
          window.location.href = taskKind === "correction"
            ? `/videos/${videoId}/correction/${taskId}`
            : `/videos/${videoId}`;
        }
        return;
      }

      setTimeout(poll, 1000);
    }

    document.getElementById("cancel-button").addEventListener("click", async () => {
      await fetch(`/api/tasks/${taskId}/cancel`, { method: "POST" });
      setTimeout(poll, 300);
    });

    poll();
  </script>
</body>
</html>
