<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-label="bili2text 框架图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d5dbe7; stroke-width: 1.4; }
      .accent { fill: #f3f6ff; stroke: #b9c5ff; stroke-width: 1.4; }
      .t1 { font: 600 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1b1d22; }
      .t2 { font: 400 12.5px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5c6470; }
      .line { stroke: #9aa4b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #b9c5ff; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="accent" x="280" y="20" width="260" height="64" rx="10"/>
  <text class="t1" x="410" y="46" text-anchor="middle">页面层</text>
  <text class="t2" x="410" y="66" text-anchor="middle">FastAPI + Jinja 模板</text>

  <line class="line" x1="410" y1="84" x2="410" y2="112"/>

  <rect class="box" x="250" y="114" width="320" height="64" rx="10"/>
  <text class="t1" x="410" y="140" text-anchor="middle">转写任务</text>
  <text class="t2" x="410" y="160" text-anchor="middle">线程池 · 下载 · ffmpeg · whisper</text>

  <line class="line" x1="410" y1="178" x2="410" y2="206"/>

  <rect class="box" x="280" y="208" width="260" height="64" rx="10"/>
  <text class="t1" x="410" y="234" text-anchor="middle">LLM 修正</text>
  <text class="t2" x="410" y="254" text-anchor="middle">分块请求 · 差异预览</text>

  <line class="line" x1="410" y1="272" x2="410" y2="300"/>

  <rect class="box" x="280" y="302" width="260" height="64" rx="10"/>
  <text class="t1" x="410" y="328" text-anchor="middle">分段与练习</text>
  <text class="t2" x="410" y="348" text-anchor="middle">分段算法 · 打字判定</text>

  <line class="line" x1="410" y1="366" x2="410" y2="394"/>

  <rect class="accent" x="250" y="396" width="320" height="46" rx="10"/>
  <text class="t2" x="410" y="424" text-anchor="middle">存储：SQLite + 工作区文件</text>

  <rect class="accent" x="590" y="20" width="210" height="64" rx="10"/>
  <text class="t1" x="695" y="46" text-anchor="middle">文档知识库</text>
  <text class="t2" x="695" y="66" text-anchor="middle">使用说明 · 背景 · 基础知识</text>

  <line class="dash" x1="540" y1="52" x2="588" y2="52"/>

  <text class="t2" x="410" y="492" text-anchor="middle">文档模块不属于主流程，只承载说明性内容</text>
</svg>
